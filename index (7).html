<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우주 숙제검사 🪐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a1c; --panel:rgba(255,255,255,.07); --line:rgba(255,255,255,.15); --ink:#f4f6ff; --mut:#a3acd2;
  --sun:#ffb938; --gas:#4fd8ff; --pink:#ff7ac8; --gold:#ffd84d;
  --fh:'Jua','Noto Sans KR',system-ui,sans-serif; --fb:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --topH:58px;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(1200px 700px at 15% -10%,#1c1450 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#0e2a5c 0%,transparent 55%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--fb);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;background:rgba(7,10,28,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--fh);font-size:21px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand small{font-family:var(--fb);font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:6px}
.tab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-family:var(--fh);font-size:17px;display:flex;gap:6px;align-items:baseline}
.tab small{font-family:var(--fb);font-size:11px;color:var(--mut)}
.tab[aria-selected=true]{background:linear-gradient(135deg,#ff7ac8,#7a6bff);border-color:transparent;color:#fff}
.tab[aria-selected=true] small{color:#ffe9fb}
.spacer{flex:1}
.modes{display:flex;gap:6px}
.pill{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;white-space:nowrap}
.pill[aria-pressed=true]{background:#fff;color:#14163a;border-color:#fff;font-weight:700}
#banner{display:none;margin:8px 12px 0;padding:8px 12px;border-radius:12px;background:rgba(255,184,56,.14);border:1px solid rgba(255,184,56,.4);color:#ffe2a8;font-size:13px;text-align:center}
#banner.show{display:block}

/* ---------- universe ---------- */
.uni{position:relative;margin:12px auto;width:calc(100% - 24px);max-width:1500px;height:calc(100vh - 128px);min-height:480px;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#11103d 0%,#05061a 72%);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.uni canvas{position:absolute;inset:0;width:100%;height:100%}
.neb{position:absolute;border-radius:50%;filter:blur(36px);opacity:0;transition:opacity 1.8s ease;animation:nebdrift 38s ease-in-out infinite alternate;mix-blend-mode:screen;pointer-events:none}
.neb:nth-child(even){animation-duration:51s;animation-direction:alternate-reverse}
@keyframes nebdrift{to{transform:translate(4%,3%) scale(1.12)}}
.aurora{position:absolute;left:-10%;right:-10%;top:4%;height:46%;opacity:0;transition:opacity 2s;background:linear-gradient(100deg,transparent 4%,hsla(150,100%,60%,.38) 25%,hsla(190,100%,65%,.42) 45%,hsla(290,100%,70%,.38) 65%,transparent 92%);filter:blur(26px);transform:skewY(-6deg);animation:aur 9s ease-in-out infinite alternate;mix-blend-mode:screen;pointer-events:none}
@keyframes aur{from{transform:skewY(-6deg) translateX(-4%)}to{transform:skewY(-3deg) translateX(4%)}}
.rbow{position:absolute;inset:0;opacity:0;transition:opacity 2s;background:linear-gradient(115deg,rgba(255,80,120,.2),rgba(255,200,60,.18),rgba(80,255,170,.18),rgba(80,170,255,.2),rgba(190,100,255,.22));animation:hue 14s linear infinite;mix-blend-mode:screen;pointer-events:none}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.uni.complete{box-shadow:0 0 0 2px rgba(255,216,77,.6),0 0 60px rgba(255,216,77,.25),0 20px 60px rgba(0,0,0,.5)}
#slots{position:absolute;inset:0}
.slot{position:absolute;pointer-events:none;z-index:2;animation:roamx var(--dx,22s) ease-in-out infinite alternate;animation-delay:var(--dxl,0s)}
.slot .bob{position:absolute;inset:0;animation:roamy var(--dy,15s) ease-in-out infinite alternate;animation-delay:var(--dyl,0s)}
.slot .pv{position:absolute;inset:0}
@keyframes roamx{from{transform:translateX(calc(var(--ax,10px)*-1))}to{transform:translateX(var(--ax,10px))}}
@keyframes roamy{from{transform:translateY(calc(var(--ay,10px)*-1))}to{transform:translateY(var(--ay,10px))}}
.slot svg{width:100%;height:100%;overflow:visible;display:block}
.slot .hit{position:absolute;left:50%;top:50%;width:54%;height:54%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:auto;cursor:pointer}
.slot.born svg{animation:born 1.3s cubic-bezier(.2,1.6,.4,1) 1}
@keyframes born{0%{transform:scale(0) rotate(-140deg)}60%{transform:scale(1.4) rotate(12deg)}100%{transform:scale(1) rotate(0)}}
.lab{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;color:#aeb7e3;text-shadow:0 1px 4px #000;pointer-events:none;z-index:3;font-weight:500}
.lab .no{display:inline-block;min-width:1.5em;margin-right:4px;padding:0 5px;border-radius:99px;background:rgba(255,255,255,.16);font-size:.82em;font-weight:700;text-align:center;color:#dfe4ff}
.lab.on .no{background:rgba(255,216,77,.9);color:#3a2600}
.lab.on{color:#fff;font-weight:700;text-shadow:0 0 8px rgba(255,255,255,.55),0 1px 4px #000}
.drift{animation:drift var(--dur,50s) linear infinite}
.drift2{animation:drift var(--dur2,30s) linear infinite}
@keyframes drift{to{transform:translateX(-68px)}}
svg.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14);filter:drop-shadow(0 0 10px #ffe27a)}}
.hud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:6;flex-wrap:wrap}
.hud .box{background:rgba(8,10,30,.58);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:8px 13px}
.hud h2{font-family:var(--fh);font-weight:400;font-size:21px}
.hud .lv{font-size:13px;color:#ffe08a;margin-top:2px}
.hud .r{text-align:right}
.cnt{font-family:var(--fh);font-size:22px}
.cnt b{color:var(--gold);font-weight:400}
.lvbar{position:absolute;left:12px;right:12px;bottom:10px;z-index:6;padding:20px 14px 6px;border-radius:14px;background:rgba(8,10,30,.58);backdrop-filter:blur(6px);border:1px solid var(--line)}
.track{position:relative;height:10px;border-radius:99px;background:rgba(255,255,255,.14);margin:6px 8px 4px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#7a6bff,#ff7ac8,#ffd84d);transition:width 1s ease;width:0}
.track span{position:absolute;top:-17px;transform:translateX(-50%);font-size:13px;filter:grayscale(1);opacity:.55;transition:.5s}
.track span.on{filter:none;opacity:1}
.lvbar .t{font-size:12px;color:var(--mut);text-align:center}
#lvup{position:absolute;left:50%;top:22%;transform:translate(-50%,-30px) scale(.8);opacity:0;z-index:9;pointer-events:none;font-family:var(--fh);font-size:clamp(20px,4vw,34px);text-align:center;padding:12px 22px;border-radius:20px;background:linear-gradient(135deg,rgba(255,122,200,.92),rgba(122,107,255,.92));box-shadow:0 10px 40px rgba(0,0,0,.5);white-space:nowrap}
#lvup.show{animation:lvup 3.6s ease forwards}
@keyframes lvup{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}20%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px) scale(1)}}

/* ---------- teacher ---------- */
.teach{max-width:780px;margin:0 auto;padding:12px 12px 90px}
.t-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.t-bar input{flex:1;min-width:150px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font-size:16px;outline:none}
.t-bar input:focus{border-color:#9d8cff}
.chips{display:flex;gap:6px}
.tsum{font-size:13px;color:var(--mut);margin:2px 2px 8px}
.tsum b{color:var(--gold)}
.t-grid{display:grid;grid-template-columns:32px minmax(56px,1fr) repeat(var(--n,4),minmax(38px,50px)) 42px;gap:5px;align-items:center}
.t-head{position:sticky;top:var(--topH);z-index:10;background:rgba(7,10,28,.94);padding:8px 0 6px;border-bottom:1px solid var(--line);text-align:center;font-size:12px;color:var(--mut)}
.t-head .grp{grid-column:span 2;font-family:var(--fh);font-size:14px;border-radius:8px;padding:3px 0}
.t-head .grp.a{background:rgba(255,185,56,.16);color:#ffd48a}
.t-head .grp.b{background:rgba(79,216,255,.14);color:#a8ecff}
.t-head .sub{font-size:12px;line-height:1.15}
.t-head .sub small{display:block;font-size:11px;opacity:.7}
.t-head .s0{color:#ffd48a}.t-head .s1{color:#a8ecff}.t-head .s2{color:#ffc2e2}.t-head .s3{color:#bdf0a8}
.row{padding:4px 0;border-radius:12px}
.row.full{background:linear-gradient(90deg,rgba(255,216,77,.16),rgba(255,216,77,.02))}
.row .n{text-align:center;color:var(--mut);font-size:13px}
.row .nm{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pg{text-align:center;font-size:12px;color:var(--mut)}
.row .pl{width:38px;height:38px;padding:0;justify-self:center}
.row .pl svg{width:100%;height:100%;overflow:visible}
.ck{height:46px;border-radius:13px;border:2px dashed rgba(255,255,255,.26);display:grid;place-items:center;font-size:22px;color:transparent;background:rgba(255,255,255,.04);transition:background .15s,border-color .15s}
.ck:active{transform:scale(.94)}
.ck.on{color:#fff;border-style:solid;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.ck.s0.on{background:linear-gradient(135deg,#ffcf5a,#ff8a3d);border-color:#ffe29a}
.ck.s1.on{background:linear-gradient(135deg,#6fe7ff,#3a8bff);border-color:#b9f1ff}
.ck.s2.on{background:linear-gradient(135deg,#ff9fd2,#d45adf);border-color:#ffd1ec}
.ck.s3.on{background:linear-gradient(135deg,#9be37a,#2fa86a);border-color:#cdf5b8}
.ck.pop{animation:stamp .3s ease-out}
@keyframes stamp{0%{transform:scale(1.7) rotate(-16deg);opacity:.2}60%{transform:scale(.9) rotate(3deg);opacity:1}100%{transform:scale(1)}}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:14px}

/* ---------- common ---------- */
.btn{padding:12px 22px;border-radius:14px;background:linear-gradient(135deg,#ff7ac8,#7a6bff);color:#fff;font-family:var(--fh);font-size:18px;box-shadow:0 6px 20px rgba(122,107,255,.4)}
.btn.ghost{background:var(--panel);box-shadow:none;border:1px solid var(--line);font-family:var(--fb);font-size:14px;padding:9px 14px}
.sheet{position:fixed;inset:0;z-index:50;display:none;place-items:safe center;background:rgba(3,4,16,.72);backdrop-filter:blur(6px);padding:16px;overflow:auto}
.sheet.show{display:grid}
.card{width:min(440px,100%);background:linear-gradient(180deg,#1b1752,#0d0f33);border:1px solid var(--line);border-radius:26px;padding:22px 20px 20px;text-align:center;position:relative;animation:cardin .3s ease-out;box-shadow:0 30px 80px rgba(0,0,0,.6)}
@keyframes cardin{from{transform:translateY(20px) scale(.96);opacity:0}}
.card .x{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);font-size:16px}
.card .big{width:min(62vw,230px);height:min(62vw,230px);margin:0 auto 6px}
.card .big svg{width:100%;height:100%;overflow:visible}
.card h3{font-family:var(--fh);font-weight:400;font-size:25px;margin:4px 0}
.card p{color:#cdd3f5;font-size:14px;line-height:1.55}
.card .feat{margin-top:8px;color:#ffe9a8}
.rar{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;color:#14163a;background:var(--c,#9db4ff)}
.chk{list-style:none;padding:0;margin:12px 0 0;text-align:left}
.chk li{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.06);margin-top:6px;font-size:15px}
.chk li i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;border:2px dashed rgba(255,255,255,.3);color:transparent}
.chk li.ok{background:rgba(255,216,77,.14)}
.chk li.ok i{background:#ffcf5a;border:2px solid #ffe29a;color:#3a2600}
.pin input,.edit textarea{width:100%;margin:12px 0 6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font-size:18px;text-align:center;outline:none}
.edit textarea{text-align:left;font-size:15px;min-height:300px;line-height:1.5;font-family:var(--fb)}
.err{color:#ff9aa8;font-size:13px;min-height:18px;margin-bottom:6px}
.row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.card.wide{width:min(640px,100%);text-align:left}
.card.wide h3{text-align:center}
.card.wide h4{font-family:var(--fh);font-weight:400;font-size:18px;margin:18px 0 4px}
.card.wide h4 small{font-family:var(--fb);font-size:12px;color:var(--mut)}
.card.wide .c{text-align:center}
.card.wide .note{font-size:12px;color:var(--mut);margin-top:14px}
.fld{display:block;margin-top:12px;font-size:13px;color:var(--mut)}
.fld input,.rowi input,.clsb textarea{width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font-size:15px;outline:none}
.rowi{display:flex;gap:6px;margin-top:6px;align-items:center}
.rowi .btn{white-space:nowrap;flex:none}
.rowi .i-name{flex:1}.rowi .i-short{width:96px;flex:none}.rowi input{margin-top:0}
.clsb{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
.clsb textarea{min-height:150px;margin-top:8px;line-height:1.5;font-family:var(--fb)}
.wait{margin:80px 20px;text-align:center;color:var(--mut);font-size:16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;z-index:90;padding:11px 18px;border-radius:14px;background:rgba(20,22,58,.96);border:1px solid var(--line);font-size:14px;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- birth ---------- */
.birth{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(44,22,96,.94),rgba(3,4,16,.97));overflow:hidden;cursor:pointer}
.birth.show{display:grid}
.b-stage{position:relative;width:min(94vw,540px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.b-msg{font-family:var(--fh);font-size:clamp(20px,4vw,26px);color:#ffe9a8;opacity:0;height:34px}
.birth.ph-charge .b-msg{opacity:1;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.b-orb{position:relative;width:min(58vw,320px,46vh);height:min(58vw,320px,46vh);display:grid;place-items:center}
.birth.ph-charge .b-orb{animation:shake .1s linear infinite}
@keyframes shake{0%{transform:translate(2px,0)}25%{transform:translate(-2px,2px)}50%{transform:translate(2px,-2px)}75%{transform:translate(-2px,0)}}
.b-seed{position:absolute;width:44%;height:44%;border-radius:50%;background:radial-gradient(circle,#fff 0%,#ffe7a0 38%,rgba(255,150,220,.55) 68%,transparent 72%);opacity:0}
.birth.ph-charge .b-seed{opacity:1;animation:charge 1.5s ease-in forwards}
.birth.legend.ph-charge .b-seed{animation-duration:2.3s;background:radial-gradient(circle,#fff 0%,#ffd84d 40%,rgba(255,170,0,.6) 68%,transparent 72%)}
@keyframes charge{0%{transform:scale(.3)}70%{transform:scale(1.1)}100%{transform:scale(1.7)}}
.b-planet{position:absolute;inset:0;transform:scale(0);opacity:0}
.b-planet svg{width:100%;height:100%;overflow:visible}
.birth.ph-pop .b-planet,.birth.ph-done .b-planet{opacity:1;animation:planetin .95s cubic-bezier(.2,1.55,.4,1) forwards}
@keyframes planetin{0%{transform:scale(0) rotate(-200deg)}100%{transform:scale(1) rotate(0)}}
.b-pop{position:absolute;font-family:var(--fh);font-size:clamp(70px,18vw,120px);color:var(--gold);-webkit-text-stroke:3px #8a3a00;paint-order:stroke fill;text-shadow:0 6px 0 #8a3a00,0 0 40px rgba(255,216,77,.8);opacity:0;pointer-events:none;z-index:3}
.birth.ph-pop .b-pop{animation:poptext 1.15s ease-out forwards}
@keyframes poptext{0%{opacity:0;transform:scale(.2) rotate(-12deg)}25%{opacity:1;transform:scale(1.25) rotate(5deg)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.5) translateY(-30px)}}
.b-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.birth.ph-pop .b-flash{animation:flash .7s ease-out}
.birth.legend.ph-pop .b-flash{background:#ffe9a0;animation-duration:1.1s}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.b-conf{position:absolute;left:50%;top:40%;pointer-events:none;z-index:4}
.b-conf i{position:absolute;width:var(--s);height:calc(var(--s)*.55);background:var(--c);border-radius:2px;animation:fly 1.9s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 140px)) rotate(var(--r)) scale(1);opacity:0}}
.b-info{opacity:0;transform:translateY(20px);transition:.5s;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.birth.ph-done .b-info{opacity:1;transform:none;pointer-events:auto}
.b-who{font-size:clamp(16px,3.6vw,20px);color:#dfe4ff}
.b-name{font-family:var(--fh);font-size:clamp(28px,7vw,42px);line-height:1.15}
.b-rar{display:inline-block;padding:4px 16px;border-radius:99px;font-weight:700;color:#14163a;background:var(--c,#9db4ff)}
.birth.legend .b-rar{background:linear-gradient(90deg,#ffe27a,#fff8d0,#ffc93a,#fff8d0,#ffe27a);background-size:200% 100%;animation:shine 2s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.b-feat{font-size:14px;color:#cdd3f5;max-width:90%;line-height:1.5}
@media (max-width:640px){.hud h2{font-size:17px}.hud .box{padding:6px 10px}.cnt{font-size:18px}.hud .lv{font-size:12px}.brand{font-size:19px}}
@media (prefers-reduced-motion:reduce){
  .neb,.aurora,.rbow,.slot,.slot .bob,.drift,.drift2{animation:none!important}
}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="brand">🪐 <span id="brandT">우주 숙제검사</span><small id="brandS"></small></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="spacer"></div>
  <div class="modes">
    <button class="pill" id="m-uni" aria-pressed="true">🔭 우주 보기</button>
    <button class="pill" id="m-teach" aria-pressed="false">🧑‍🏫 선생님</button>
    <button class="pill" id="m-snd" aria-pressed="true" title="소리 켜기/끄기">🔊</button>
  </div>
</header>
<div id="banner"></div>
<main id="view"></main>

<div class="sheet" id="sheet"></div>

<div class="birth" id="birth">
  <div class="b-flash"></div>
  <div class="b-conf" id="bconf"></div>
  <div class="b-stage">
    <div class="b-msg" id="bmsg">행성이 태어나고 있어요…</div>
    <div class="b-orb">
      <div class="b-seed"></div>
      <div class="b-planet" id="bplanet"></div>
      <div class="b-pop">뿅!</div>
    </div>
    <div class="b-info">
      <div class="b-who" id="bwho"></div>
      <div class="b-name" id="bname"></div>
      <div class="b-rar" id="brar"></div>
      <div class="b-feat" id="bfeat"></div>
      <button class="btn" id="bclose">우주로 보내기 🚀</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   설정
   ========================================================= */

      o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}
  },
  stamp(){this.tone(220,70,.13,'square',.1);this.tone(90,50,.1,'sine',.18,.02)},
  undo(){this.tone(300,160,.12,'triangle',.08)},
  charge(){this.tone(120,700,1.4,'sawtooth',.05)},
  pop(r){this.tone(300,900,.18,'sine',.2);this.tone(600,1400,.25,'triangle',.12,.1);this.tone(900,1800,.3,'sine',.1,.22); if(r>=2){this.tone(1200,2200,.4,'sine',.08,.35)}}
};

const parseRoster=t=>{const out=[],seen=new Set();String(t||'').split(/\r?\n/).forEach(l=>{const m=l.match(/^\s*(\d{1,3})[\s.:)\-]+(.+?)\s*$/);if(m){const n=+m[1];if(!seen.has(n)){seen.add(n);out.push({num:n,name:m[2]});}}});return out};
const CFG=()=>S.cfg||DEFAULT_CFG;
const NI=()=>CFG().items.length;
const itemNames=()=>CFG().items.map(i=>i.name);

const getRoster=c=>{const k=classOf(c);return k?parseRoster(k.roster):[]};
const themeFor=id=>THEMES[Math.max(0,classes().findIndex(c=>c.id===id))%THEMES.length];
const normDone=d=>{const n=NI(),a=Array.isArray(d)?d.slice(0,n):[];while(a.length<n)a.push(false);return a.map(Boolean)};
const chk=(c,n)=>S.checks[key(c,n)]||null;
const doneArr=(c,n)=>{const x=chk(c,n);return normDone(x&&x.done)};
const cnt=(c,n)=>doneArr(c,n).filter(Boolean).length;
const isAll=d=>{const a=normDone(d);return a.length>0&&a.every(Boolean)};
const isFull=(c,n)=>{const x=chk(c,n);return !!x&&isAll(x.done)&&x.seed!=null};
const nameOf=(c,n)=>{const s=getRoster(c).find(s=>s.num===n);return s?s.name:n+'번'};
const fullName=(c,n)=>`${n}번 ${nameOf(c,n)}`;
function fullCount(c,excludeHeld=true){return getRoster(c).filter(s=>isFull(c,s.num)&&!(excludeHeld&&S.hold.has(key(c,s.num)))).length}

function toast(msg,ms=2400){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms)}
function setBanner(msg){const b=$('#banner');if(msg){b.textContent=msg;b.classList.add('show')}else{b.classList.remove('show')}}
function localSave(){try{localStorage.setItem('hw-checks-v2',JSON.stringify(S.checks));localStorage.setItem('hw-cfg-v2',JSON.stringify(S.cfg))}catch(e){}}
function localLoad(){try{const a=JSON.parse(localStorage.getItem('hw-checks-v2')||'{}');const cfg=JSON.parse(localStorage.getItem('hw-cfg-v2')||'null');return {a,cfg}}catch(e){return {a:{},cfg:null}}}

function persist(id,data){
  if(!S.db){localSave();return}
  S.wq[id]=(S.wq[id]||Promise.resolve()).then(()=>S.db.doc('checks/'+id).set(data)).catch(e=>{
    toast('저장하지 못했어요. 선생님 계정(편집 권한)으로 열었는지 확인해 주세요.',4200);
    resync();
  });
}
async function resync(){
  if(!S.db)return;
  try{const snap=await S.db.collection('checks').get();const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});applyChecks(m,{silent:true});}catch(e){}
}
function toggle(cls,num,k){
  if(!S.ready||!S.cfg){toast('저장소에 연결하는 중이에요. 잠시만요!');return}
  if(S.canWrite===false){toast('보기 전용 계정이에요. 선생님 계정으로 열어야 체크할 수 있어요.',3600);return}
  const id=key(cls,num),cur=S.checks[id]||{cls,num,done:Array(NI()).fill(false),seed:null,completedAt:null};
  const done=normDone(cur.done);done[k]=!done[k];
  const full=isAll(done);
  const next={cls,num,done,seed:cur.seed,completedAt:cur.completedAt};
  if(full&&next.seed==null){const a=new Uint32Array(1);(window.crypto||{getRandomValues:x=>{x[0]=Math.floor(Math.random()*4294967296)}}).getRandomValues(a);next.seed=a[0]}
  if(full&&next.completedAt==null)next.completedAt=Date.now();
  done[k]?sfx.stamp():sfx.undo();
  applyChecks({...S.checks,[id]:next});
  if(S.mode==='teach')updateRow(num,done[k]?k:-1);
  persist(id,next);
}

/* 체크 상태가 바뀔 때마다 호출 (내 입력 / 다른 기기 변경 모두) */
function applyChecks(m,{silent=false}={}){
  const old=S.checks;S.checks=m;
  const births=[];
  for(const id in m){
    const c=m[id];if(!c||!Array.isArray(c.done))continue;
    if(isAll(c.done)&&c.seed!=null){
      const bk=id+':'+c.completedAt;
      if(!S.seen.has(bk)){S.seen.add(bk);if(!silent&&c.cls===S.cls)births.push(c)}
    }
  }
  if(!S.cfg)return;
  births.forEach(c=>{S.hold.add(key(c.cls,c.num));S.bq.push(c)});
  renderTabs();
  if(S.mode==='uni'){updateUniverse()}
  else{
    const ids=new Set([...Object.keys(old),...Object.keys(m)]);
    ids.forEach(id=>{if(old[id]!==m[id]){const c=m[id]||old[id];if(c&&c.cls===S.cls)updateRow(c.num)}});
    updateHead();
  }
  pumpBirth();
}

const COLS=['#ffffff','#fff3c4','#cfe6ff','#ffd1f0','#c9ffe6'];
const Sky={cv:null,ctx:null,stars:[],r:0,level:0,shoot:[],raf:0,w:0,h:0,
  init(cv,cls){
    this.cv=cv;this.ctx=cv.getContext('2d');
    const R=mulberry32(cls*7919+13);
    this.stars=Array.from({length:280},(_,i)=>({x:R(),y:R(),s:R()*1.3+.35,p:R()*6.28,sp:.5+R()*1.8,ci:i%5}));
    this.shoot=[];this.resize();cancelAnimationFrame(this.raf);this.raf=requestAnimationFrame(t=>this.loop(t));
  },
  resize(){const cv=this.cv;if(!cv)return;const dpr=Math.min(2,window.devicePixelRatio||1);this.w=cv.clientWidth;this.h=cv.clientHeight;cv.width=Math.max(1,this.w*dpr);cv.height=Math.max(1,this.h*dpr);this.ctx.setTransform(dpr,0,0,dpr,0,0)},
  loop(t){
    const cv=this.cv;if(!cv||!cv.isConnected)return;
    const g=this.ctx,w=this.w,h=this.h;g.clearRect(0,0,w,h);
    const n=Math.round(40+this.r*240),colA=clamp((this.r-.25)/.4,0,1);
    for(let i=0;i<n;i++){
      const s=this.stars[i];const tw=REDUCE?1:(.55+.45*Math.sin(t*.001*s.sp+s.p));
      let a=tw*(.4+.5*Math.min(1,s.s/1.2));if(s.ci>2)a*=colA;if(a<=.02)continue;
      g.globalAlpha=a;g.fillStyle=COLS[s.ci];const x=s.x*w,y=s.y*h;
      g.beginPath();g.arc(x,y,s.s,0,6.283);g.fill();
      if(s.s>1.4&&a>.5){g.globalAlpha=a*.5;g.fillRect(x-s.s*2.6,y-.4,s.s*5.2,.8);g.fillRect(x-.4,y-s.s*2.6,.8,s.s*5.2)}
    }
    g.globalAlpha=1;
    const rate=[0,0,0,.004,.008,.014,.03][this.level]||0;
    if(!REDUCE&&Math.random()<rate)this.shoot.push({x:w*(.3+Math.random()*.7),y:Math.random()*h*.4,vx:-(6+Math.random()*4),vy:3+Math.random()*3,l:0,max:50+Math.random()*30,hue:Math.random()*360});
    this.shoot=this.shoot.filter(o=>{
      o.x+=o.vx;o.y+=o.vy;o.l++;const k=1-o.l/o.max;if(k<=0)return false;
      const gr=g.createLinearGradient(o.x,o.y,o.x-o.vx*7,o.y-o.vy*7);
      gr.addColorStop(0,`hsla(${o.hue},100%,85%,${k})`);gr.addColorStop(1,'rgba(255,255,255,0)');
      g.strokeStyle=gr;g.lineWidth=2;g.beginPath();g.moveTo(o.x,o.y);g.lineTo(o.x-o.vx*7,o.y-o.vy*7);g.stroke();return true;
    });
    this.raf=requestAnimationFrame(tt=>this.loop(tt));
  }
};

function layoutSlots(){
  const uni=$('#uni');if(!uni)return;
  const roster=S.roster,n=roster.length;if(!n)return;
  const W=uni.clientWidth,mobile=W<640,padT=mobile?150:76,padB=100,aw=W-16;
  let H,best;
  if(mobile){
    const c=4,r=Math.ceil(n/c),cw=aw/c,rowH=cw*1.15;
    H=Math.round(padT+padB+r*rowH);uni.style.height=H+'px';
    const ch=(H-padT-padB)/r;best={c,r,cw,ch,D:Math.min(cw*.8,(ch-18)*.9)};
  }else{
    uni.style.height='';H=uni.clientHeight;const ah=H-padT-padB;
    for(let c=1;c<=n;c++){const r=Math.ceil(n/c),cw=aw/c,ch=ah/r,D=Math.min(cw*.8,(ch-18)*.9);if(!best||D>best.D)best={c,r,cw,ch,D}}
  }
  const {c,cw,ch}=best,D=Math.max(26,best.D);
  roster.forEach((st,i)=>{
    const col=i%c,row=Math.floor(i/c);
    const jx=(jr(st.num,1)-.5)*Math.max(0,cw-D)*.7,jy=(jr(st.num,2)-.5)*Math.max(0,ch-D-18)*.6;
    const cx=8+(col+.5)*cw+jx,cy=padT+(row+.5)*ch+jy-6,box=D*1.7,e=S.slotEls[st.num];if(!e)return;
    Object.assign(e.slot.style,{left:(cx-box/2)+'px',top:(cy-box/2)+'px',width:box+'px',height:box+'px'});
    Object.assign(e.lab.style,{top:(box/2+D*.54+2)+'px',fontSize:clamp(D*.2,10,15)+'px'});
    e.slot.style.setProperty('--ax',Math.max(8,cw*.26)+'px');e.slot.style.setProperty('--ay',Math.max(8,Math.min(ch*.22,D*.4))+'px');
  });
}
function levelOf(r){let l=0;LV.forEach((x,i)=>{if(r>=x.t&&(i===0||r>0))l=i});return l}
function renderSlot(st){
  const e=S.slotEls[st.num];if(!e)return;
  const id=key(S.cls,st.num),p=cnt(S.cls,st.num),held=S.hold.has(id);

    <div class="t-bar"><input id="q" type="search" placeholder="🔍 번호 또는 이름" autocomplete="off" value="${esc(S.q)}">
      <div class="chips">${[['all','전체'],['todo','미완료'],['done','완료']].map(([v,t])=>`<button class="pill" data-f="${v}" aria-pressed="${S.flt===v}">${t}</button>`).join('')}</div>
      <button class="pill" id="edit">⚙️ 설정</button></div>
    <div class="tsum" id="tsum"></div>
    <div class="t-head t-grid" id="thead"></div>
    <div id="tlist"></div>
    <div class="hint">칸을 누르면 도장이 ‘쾅!’ 찍혀요 · 모든 칸을 받으면 행성이 태어나요 🪐<br>다시 누르면 취소돼요 (행성은 그대로 보관돼요)</div>
  </section>`;
  $('#q').addEventListener('input',e=>{S.q=e.target.value;renderList()});
  $$('[data-f]').forEach(b=>b.onclick=()=>{S.flt=b.dataset.f;$$('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderList()});
  $('#edit').onclick=()=>openSettings(false);
  $('#tlist').addEventListener('click',e=>{
    const row=e.target.closest('.row');if(!row)return;const num=+row.dataset.num;
    const ck=e.target.closest('.ck');
    if(ck){toggle(S.cls,num,+ck.dataset.k);return}
    if(e.target.closest('.pl'))openSheet(num);
  });
  syncTop();updateHead();renderList();
}
function updateHead(){
  const h=$('#thead');if(!h)return;
  const items=CFG().items,cn=Array(items.length).fill(0);let full=0;
  S.roster.forEach(st=>{doneArr(S.cls,st.num).forEach((v,k)=>{if(v)cn[k]++});if(isFull(S.cls,st.num))full++});
  h.innerHTML=`<div>번호</div><div>이름</div>${items.map((it,k)=>`<div class="sub s${k%4}" title="${esc(it.name)}">${esc(it.short||it.name.slice(0,4))}<small>${cn[k]}</small></div>`).join('')}<div>행성</div>`;
  $('#tsum').innerHTML=`🪐 행성 탄생 <b>${full}</b>명 / 전체 ${S.roster.length}명`;
}
function rowHTML(st,pop){
  const c=chk(S.cls,st.num),d=doneArr(S.cls,st.num),p=d.filter(Boolean).length,full=isFull(S.cls,st.num),names=itemNames();
  const btns=d.map((v,k)=>`<button class="ck s${k%4}${v?' on':''}${pop===k?' pop':''}" data-k="${k}" aria-pressed="${v}" aria-label="${esc(st.name)} ${esc(names[k])}">✔</button>`).join('');
  const tail=full?`<button class="pl" title="행성 보기">${planetSVG(genPlanet(c.seed),{animate:false})}</button>`:`<div class="pg">${p}/${d.length}</div>`;
  return `<div class="row t-grid${full?' full':''}" data-num="${st.num}"><div class="n">${st.num}</div><div class="nm">${esc(st.name)}</div>${btns}${tail}</div>`;
}
function renderList(){
  const list=$('#tlist');if(!list)return;
  const q=S.q.trim();
  const rows=S.roster.filter(st=>{
    if(q&&!(String(st.num)===q||st.name.includes(q)))return false;
    const f=isFull(S.cls,st.num);
    return S.flt==='all'||(S.flt==='todo'?!f:f);
  });
  list.innerHTML=rows.length?rows.map(st=>rowHTML(st)).join(''):'<div class="hint">해당하는 학생이 없어요</div>';
}
function updateRow(num,pop=-2){
  const old=$(`.row[data-num="${num}"]`);const st=S.roster.find(s=>s.num===num);if(!old||!st)return;
  const t=document.createElement('div');t.innerHTML=rowHTML(st,pop);old.replaceWith(t.firstElementChild);
  updateHead();
}
const itemRow=it=>`<div class="rowi" data-it><input class="i-name" maxlength="30" placeholder="항목 이름 (예: 형성평가)" value="${esc(it.name)}"><input class="i-short" maxlength="5" placeholder="짧은 이름" value="${esc(it.short||'')}"><button class="btn ghost" data-del aria-label="항목 삭제">✕</button></div>`;
const classBlock=c=>`<div class="clsb" data-id="${c.id}"><div class="rowi"><input class="c-name" maxlength="12" placeholder="반 이름 (예: 3반)" value="${esc(c.name)}"><button class="btn ghost" data-del aria-label="반 삭제">반 삭제</button></div><textarea class="c-roster" spellcheck="false" placeholder="한 줄에 한 명씩: 번호 이름&#10;1 김하늘&#10;2 이바다">${esc(c.roster)}</textarea></div>`;
function openSettings(first){
  const cfg=S.cfg||DEFAULT_CFG;
  let nextId=Math.max(0,...cfg.classes.map(c=>c.id))+1;
  openModal(`<div class="card edit wide">${first?'':'<button class="x" data-x aria-label="닫기">✕</button>'}<h3>${first?'처음 설정':'설정'}</h3>
    ${first?'<p class="c">한 번만 정하면 돼요. 나중에 선생님 모드의 ⚙️ 설정에서 언제든 바꿀 수 있어요.</p>':''}
    <label class="fld">제목<input id="s-title" maxlength="20" value="${esc(cfg.title)}"></label>
    <label class="fld">학년 (우주 화면에 ‘1학년 3반 우주’처럼 표시돼요. 비워도 돼요)<input id="s-grade" maxlength="10" value="${esc(cfg.grade)}"></label>
    <label class="fld">선생님 모드 비밀번호 (비워두면 없음)<input id="s-pin" maxlength="12" value="${esc(cfg.pin)}"></label>
    <h4>숙제 검사 항목 <small>1~${MAXI}개</small></h4><div id="s-items">${cfg.items.map(itemRow).join('')}</div><button class="btn ghost" id="s-addi">＋ 항목 추가</button>
    <h4>반과 학생 명단</h4><div id="s-classes">${cfg.classes.map(classBlock).join('')}</div><button class="btn ghost" id="s-addc">＋ 반 추가</button>
    <p class="note">명단은 ‘번호 이름’ 형식으로 한 줄에 한 명씩 적어요. 번호가 같으면 체크 기록이 그대로 이어져요. 항목 개수를 바꾸면 이미 쌓인 기록과 맞지 않을 수 있어요.</p>
    <div class="err" id="s-err"></div><div class="row2"><button class="btn" id="s-save">저장</button></div></div>`,(m,close)=>{
    const card=$('.card',m),err=t=>{$('#s-err').textContent=t};
    card.addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(d){const r=d.closest('[data-it],.clsb');if(r)r.remove()}});
    $('#s-addi').onclick=()=>{if($$('#s-items [data-it]').length>=MAXI){err(`항목은 최대 ${MAXI}개까지 만들 수 있어요`);return}err('');$('#s-items').insertAdjacentHTML('beforeend',itemRow({name:'',short:''}))};
    $('#s-addc').onclick=()=>{err('');$('#s-classes').insertAdjacentHTML('beforeend',classBlock({id:nextId++,name:'',roster:''}))};
    $('#s-save').onclick=()=>{
      const items=$$('#s-items [data-it]').map(r=>{const name=$('.i-name',r).value.trim();return {name,short:($('.i-short',r).value.trim()||name.slice(0,4))}}).filter(i=>i.name);
      if(!items.length){err('숙제 항목을 하나 이상 적어 주세요');return}
      const cl=[];
      for(const b of $$('#s-classes .clsb')){
        const name=$('.c-name',b).value.trim(),list=parseRoster($('.c-roster',b).value);
        if(!name){err('반 이름을 적어 주세요');return}
        if(!list.length){err(`${name} 명단이 비어 있어요. “번호 이름” 형식으로 적어 주세요`);return}
        cl.push({id:+b.dataset.id,name,roster:list.map(x=>x.num+' '+x.name).join('\n')});
      }
      if(!cl.length){err('반을 하나 이상 만들어 주세요');return}
      const title=$('#s-title').value.trim()||DEFAULT_CFG.title;
      saveCfg({title,grade:$('#s-grade').value.trim(),pin:$('#s-pin').value.trim(),items,classes:cl});
      S.pin=true;close();toast('설정을 저장했어요');
    };
  });
}
function saveCfg(cfg){
  S.cfg=cfg;S.cfgState='ok';applyCfg();
  if(S.db)S.db.doc('config/settings').set(cfg).catch(()=>toast('설정을 저장하지 못했어요 (편집 권한 필요)',3600));
  else localSave();
  render();
}
function applyCfg(){
  const c=S.cfg;if(!c)return;
  if(S.cls==null||!classOf(S.cls))S.cls=c.classes[0]?c.classes[0].id:null;
  document.title=c.title+' 🪐';
  $('#brandT').textContent=c.title;$('#brandS').textContent=c.grade||'';
}
function askPin(){
  openModal(`<div class="card pin"><button class="x" data-x aria-label="닫기">✕</button><h3>🔒 선생님 확인</h3><p>비밀번호를 입력해 주세요</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12"><div class="err" id="perr"></div><button class="btn" id="pok">확인</button></div>`,(m,close)=>{
    const go=()=>{if($('#pin').value===CFG().pin){S.pin=true;close();setMode('teach')}else{$('#perr').textContent='비밀번호가 맞지 않아요';$('#pin').value='';$('#pin').focus()}};
    $('#pok').onclick=go;$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')go()});setTimeout(()=>$('#pin').focus(),50);
  });
}

/* =========================================================
   공통 화면
   ========================================================= */
function syncTop(){document.documentElement.style.setProperty('--topH',$('#top').offsetHeight+'px')}
function renderTabs(){
  $('#tabs').innerHTML=classes().map(c=>`<button class="tab" role="tab" data-c="${c.id}" aria-selected="${S.cls===c.id}">${esc(c.name)}<small>🪐 ${fullCount(c.id)}/${getRoster(c.id).length}</small></button>`).join('');
  $$('#tabs .tab').forEach(b=>b.onclick=()=>setCls(+b.dataset.c));
  $('#m-uni').setAttribute('aria-pressed',S.mode==='uni');
  $('#m-teach').setAttribute('aria-pressed',S.mode==='teach');
  syncTop();
}
function render(){
  if(!S.cfg){
    $('#tabs').innerHTML='';
    const msg=S.cfgState==='viewer'?'선생님이 아직 설정을 마치지 않았어요. 잠시 뒤에 다시 열어 주세요.':S.cfgState==='needsetup'?'처음 설정이 필요해요.':'불러오는 중…';
    $('#view').innerHTML=`<div class="wait">${msg}</div>`;
    return;
  }
  renderTabs();S.mode==='uni'?buildUniverse():buildTeacher();
}
function setCls(c){
  if(c===S.cls)return;
  S.cls=c;S.q='';
  S.bq=S.bq.filter(x=>x.cls===c);
  render();
}
function setMode(m){
  if(!S.cfg)return;
  if(m==='teach'&&!S.pin&&CFG().pin){askPin();return}
  S.mode=m;render();
}
$('#m-uni').onclick=()=>setMode('uni');
$('#m-teach').onclick=()=>setMode('teach');
$('#m-snd').onclick=e=>{sfx.on=!sfx.on;e.currentTarget.setAttribute('aria-pressed',sfx.on);e.currentTarget.textContent=sfx.on?'🔊':'🔇';if(sfx.on)sfx.stamp()};
$('#bclose').addEventListener('click',e=>{e.stopPropagation();closeBirth()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#birth').classList.contains('show'))closeBirth();else{$('#sheet').classList.remove('show');$('#sheet').innerHTML=''}}});
window.addEventListener('resize',syncTop);

/* =========================================================
   시작
   ========================================================= */
async function init(){
  render();
  setBanner('☁️ 저장소에 연결하는 중…');
  let db=null,user=null;
  try{ if(typeof claude!=='undefined'){db=await claude.use('db');user=await claude.use('user');} }catch(e){}
  S.db=db;
  if(!db){
    const L=localLoad();
    if(L.cfg){S.cfg=L.cfg;S.cfgState='ok';applyCfg()}
    applyChecks(L.a||{},{silent:true});
    S.ready=true;S.loaded=true;
    setBanner('⚠️ 미리보기 모드예요. 이 화면의 체크는 이 기기에만 저장돼요.');
    if(S.cfg)render();else{S.cfgState='needsetup';render();openSettings(true)}
    return;
  }
  try{ if(user&&typeof user.can==='function'){const w=await user.can('data.write');if(w===false)S.canWrite=false} }catch(e){}
  if(S.canWrite===false)setBanner('👀 보기 전용 계정이에요. 체크는 선생님 계정(편집 권한)에서만 저장돼요.');
  let seenDefinitive=false,wizard=false,timer=setTimeout(()=>{if(!seenDefinitive)setBanner('연결이 느려요. 잠시만 기다려 주세요…')},10000);
  db.doc('config/settings').onSnapshot(s=>{
    const definitive=!(s.metadata&&s.metadata.fromCache);
    if(s.exists){
      S.cfg=s.data();S.cfgState='ok';applyCfg();
      if(wizard){wizard=false;$('#sheet').classList.remove('show');$('#sheet').innerHTML=''}
      render();
    }else if(definitive&&!S.cfg){
      if(S.canWrite===false){S.cfgState='viewer';render()}
      else if(!wizard){S.cfgState='needsetup';wizard=true;render();openSettings(true)}
    }
  },()=>{});
  db.collection('checks').onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});
    const definitive=!(snap.metadata&&snap.metadata.fromCache);
    const silent=!seenDefinitive;
    if(definitive&&!seenDefinitive){
      seenDefinitive=true;clearTimeout(timer);S.loaded=true;
      setBanner(S.canWrite===false?'👀 보기 전용 계정이에요. 체크는 선생님 계정(편집 권한)에서만 저장돼요.':'');
    }
    S.ready=true;
    applyChecks(m,{silent});
  },err=>{
    clearTimeout(timer);S.ready=true;
    setBanner('저장소 연결이 끊겼어요. 새로고침해 주세요.');
  });
}
init();
</script>
</body>
</html>
